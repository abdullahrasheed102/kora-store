{#
  The shared layout for every HTML email.
  Email apps are not browsers: many ignore <style> blocks, flexbox and web fonts. So the layout
  uses tables, every style is inline, and the width is fixed at 600px (it shrinks on phones).
#}
{% set c = colors %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{ subject }}</title>
{# Apple Mail and iOS load this; Gmail and Outlook don't, so every heading falls back to Georgia. #}
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:{{ c.background }};color:{{ c.ink }};">
{# The preheader: the grey preview line next to the subject in the inbox list. Hidden in the email itself. #}
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:{{ c.background }};">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
        <tr>
          <td style="padding:0 8px 20px;font-family:Fraunces,Georgia,'Times New Roman',serif;font-size:24px;font-weight:500;letter-spacing:-0.01em;color:{{ c.ink }};">
            <a href="{{ site_url }}" style="color:{{ c.ink }};text-decoration:none;">Kora Outfitters</a>
          </td>
        </tr>
        <tr>
          <td style="background:{{ c.card }};border:1px solid {{ c.border }};border-radius:16px;padding:36px 32px;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.6;color:{{ c.ink }};">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:24px 8px 0;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.6;color:{{ c.muted }};">
            {% block footer_note %}{% endblock %}
            <p style="margin:0 0 6px;">Kora Outfitters is a demo store. No real products are sold or shipped.</p>
            {% if support_email and audience is not defined %}{# not on staff alerts #}
            <p style="margin:0;">Questions? Just reply to this email.</p>
            {% endif %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
